name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vercel already builds every push. This exists so a red check shows up on the
# pull request itself, and so type and format errors are caught even when a
# change would still build successfully.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build (static export)
        run: npm run build

      - name: Fail if the export is empty
        run: test -s out/index.html
