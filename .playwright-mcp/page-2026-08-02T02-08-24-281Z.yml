            - heading "Platform Reliability & Scale" [level=3] [ref=f8e71]
            - paragraph [ref=f8e72]: Systems that hold when volume spikes. Capacity planning, observability, incident response, and the operational discipline that keeps uptime at four nines.
          - listitem [ref=f8e73]:
            - heading "Partner Integrations" [level=3] [ref=f8e76]
            - paragraph [ref=f8e77]: The technical surface between us and the largest merchants on the internet. Integrations that survive their roadmap changes, and onboarding that does not take a heroic effort every time.
          - listitem [ref=f8e78]:
            - heading "AI-Augmented Delivery" [level=3] [ref=f8e82]
            - paragraph [ref=f8e83]: "AI applied where it actually pays off in the delivery loop: code review, scaffolding, migrations, and test coverage. With enough guardrails that speed does not turn into debt."
          - listitem [ref=f8e84]:
