        - paragraph [ref=f8e63]: "I'm an engineering leader who owns the infrastructure Button runs on: the partner integrations, the routing layer, and the reliability guarantees everything downstream depends on. I'm also a founder and builder. I've taken products from an empty repo to paying customers across engineering, design, and go to market, which is why I usually push for the version that ships."
