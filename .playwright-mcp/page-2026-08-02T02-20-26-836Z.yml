      - generic [ref=f9e64]:
        - heading "About" [level=2] [ref=f9e65]
        - paragraph [ref=f9e66]: "I'm an engineering leader with 19 years building and running technical organizations, including more than ten years in management. At Button I own Core Engineering and Solutions Engineering, the platform behind $100B+ in driven mobile commerce for Amazon, Walmart, Uber, Lyft, Fetch, and Sam's Club. I'm a hands on architect who still ships: I fix the systems, then I fix the organization that owns them. Separately I founded Digital Tide, a consultancy that stands companies up end to end."
    - region [ref=f9e67]:
      - generic [ref=f9e68]:
        - heading "What I do" [level=2] [ref=f9e69]
        - list [ref=f9e70]:
          - listitem [ref=f9e71]:
            - heading "Platform Reliability & Scale" [level=3] [ref=f9e74]
            - paragraph [ref=f9e75]: Incident command, on-call and severity design, blameless postmortems, SLAs, and peak load readiness. The operational discipline that keeps uptime at four nines instead of hoping for it.
          - listitem [ref=f9e76]:
            - heading "Partner Integrations" [level=3] [ref=f9e79]
            - paragraph [ref=f9e80]: The technical and relationship surface between us and the largest merchants on the internet. Enterprise integrations, escalation management, and attribution pipelines that survive a partner roadmap change.
          - listitem [ref=f9e81]:
            - heading "AI-Augmented Delivery" [level=3] [ref=f9e85]
            - paragraph [ref=f9e86]: "Claude and MCP in the delivery loop where it compounds: review, scaffolding, migrations, and tightly scoped internal tooling. Guardrails first, so velocity does not turn into debt."
          - listitem [ref=f9e87]:
            - heading "Product & Design" [level=3] [ref=f9e91]
            - paragraph [ref=f9e92]: Enough craft to prototype an idea instead of describing it. I write the spec, draw the screens, cut the scope, and hand the team something they can build.
