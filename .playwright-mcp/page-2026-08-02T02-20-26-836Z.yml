              - paragraph [ref=f9e101]: Remote (NYC)
            - generic [ref=f9e102]:
              - paragraph [ref=f9e103]: Senior Engineering Manager, Core Engineering & Solutions Engineering
              - paragraph [ref=f9e104]: "Own two engineering functions and 13 direct reports: Core Engineering (routing, attribution, data, infrastructure) and Solutions Engineering (partner delivery and technical escalation), for the platform behind $100B+ in driven mobile commerce across 200+ brands including Amazon, Walmart, Uber, Lyft, Fetch, Target, and Sam's Club. I own both the platform and the partner handoff that most orgs split and drop."
              - generic [ref=f9e105]:
                - heading "Reliability, run the business and keep the lights on" [level=4] [ref=f9e106]
                - list [ref=f9e107]:
                  - listitem [ref=f9e108]: "Own the RTB/KTLO mandate for the core platform: reliability, tech debt paydown, and operational load for the systems moving $100B+ in commerce."
                  - listitem [ref=f9e109]: Rebuilt on-call, severity classification, and blameless postmortems from scratch, sustaining 99.99% uptime and cutting MTTR.
                  - listitem [ref=f9e110]: Incident commander through Prime Day and Fetch's Super Bowl, where the platform peaked at roughly 5,260 RPS, about 2.6x the planned peak, with 4XX errors inside normal limits.
                  - listitem [ref=f9e111]: Cut core engineering interrupts about 30% by standing up a Support to Data to Core escalation flow, converting reactive firefighting into protected delivery capacity.
              - generic [ref=f9e112]:
                - heading "Scale, platform modernization, and AI-augmented operations" [level=4] [ref=f9e113]
                - list [ref=f9e114]:
                  - listitem [ref=f9e115]: Hardened the order pipeline with parallelized finalization workers, load tested to 5,000 RPS, and drove Aurora migrations, ComStore and Django modernization, and Terraform plus AWS provider upgrades, clearing debt that had blocked platform progress.
                  - listitem [ref=f9e116]: Stood up ML platform infrastructure on SageMaker and backed cost discipline including a single AWS savings of roughly $70K per year.
                  - listitem [ref=f9e117]: Sponsored internal read-only LLM tooling, a Sam's Club order debugger and a CSV validator, that cut manual triage load. Built with tightly scoped tools to prevent hallucination.
                  - listitem [ref=f9e118]: Helped drive AI-augmented delivery across the org, with Claude attributed code reaching about 45% of lines shipped and roughly two thirds of merged PRs.
              - generic [ref=f9e119]:
                - heading "Partner integrations and revenue" [level=4] [ref=f9e120]
                - list [ref=f9e121]:
                  - listitem [ref=f9e122]: Solutions Engineering landed and scaled integrations across Best Buy, Sam's Club (Glass and mParticle migration), TurboTax, Target, Fetch, Uber One, Lululemon, Hostelworld, Puma, and Albertsons.
                  - listitem [ref=f9e123]: Cut enterprise integration onboarding time 30% and raised revenue per integration 20% by standardizing the integration path and removing bespoke per partner engineering.
                  - listitem [ref=f9e124]: Defined the SLAs and escalation model across Solutions Engineering, Partner Success, and Support.
                  - listitem [ref=f9e125]: Led formation and initial delivery of Button's retail media product with NY Post, Forbes, and BuzzFeed.
              - generic [ref=f9e126]:
                - heading "Organization" [level=4] [ref=f9e127]
